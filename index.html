<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хихихи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Экран с вопросом -->
    <div class="card" id="question-card">
        <h1 id="question">Ты любишь меня? ❤️</h1>
        <div class="btns">
            <button id="yesBtn">ДА</button>
            <button id="noBtn">НЕТ</button>
        </div>
    </div>

    <!-- 2. Экран со стикером и отсчётом -->
    <div id="happy-screen" class="hidden">
        <h1>Я ТЕБЯ ТОЖЕ! 💖</h1>
        <div class="photo-container">
            <img src="img/my-happy-face.png" alt="Смайлик" id="myFace">
        </div>
        <div class="hearts-bg">❤️❤️❤️</div>
        <!-- Таймер 10 секунд -->
        <div id="timer-box">
            Секретная игра через: <span id="countdown">10</span> сек...
        </div>
    </div>

    <!-- 3. Экран мини-игры -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <h2>Лови сердечки, красавица! 💕</h2>
            <div class="score">Собрано очков: <span id="score-count">0</span> / 30</div>
        </div>
        <div id="game-area"></div>
        <div id="win-message" class="hidden">
            🎉 ТЫ ВЫИГРАЛА МОЁ СЕРДЦЕ НАВСЕГДА! ❤️
        </div>
    </div>

    <!-- Фоновая музыка -->
    <audio id="bgMusic" src="audio/687dd7703acdd.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
